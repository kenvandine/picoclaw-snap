name: PR smoke test

on:
  pull_request:
    paths:
      - 'snap/**'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install snapd
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo ln -sf /var/lib/snapd/snap /snap

      - name: Start snapd
        run: |
          sudo systemctl start snapd
          sudo systemctl start snapd.socket
          sleep 5

      - name: Install snapcraft
        run: sudo snap install snapcraft --channel=8.x/stable --classic

      - name: Build snap
        run: snapcraft pack
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install snap
        run: |
          SNAP_FILE=$(ls -t picoclaw_*.snap | head -1)
          if [ -z "$SNAP_FILE" ]; then
            echo "No snap file found"
            exit 1
          fi
          echo "Installing $SNAP_FILE"
          sudo snap install --dangerous "$SNAP_FILE" --classic
          snap wait system seed.loaded
          sleep 5

      - name: Test picoclaw CLI
        run: |
          picoclaw version 2>&1 | head -20 || true
          picoclaw --help 2>&1 | head -25 || true

      - name: Test onboard
        run: |
          picoclaw onboard </dev/null 2>&1 | tail -10 || true

      - name: Test daemon command
        run: |
          picoclaw.daemon --help 2>&1 | head -20 || true

      - name: Test lemonade command
        run: |
          # No lemonade-server in CI, so this exits non-zero with a friendly
          # "not detected" message; we only assert the app runs without crashing.
          picoclaw.lemonade </dev/null 2>&1 | head -20 || true
