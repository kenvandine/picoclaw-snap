name: Check for new releases

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get latest upstream release
        id: upstream
        run: |
          LATEST=$(curl -sL \
            "https://api.github.com/repos/sipeed/picoclaw/releases/latest" \
            | grep '"tag_name"' | head -1 \
            | sed 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/' | sed 's/^v//')
          if [ -z "$LATEST" ]; then
            echo "Failed to get upstream version"
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Get this repo's latest release
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The snap version is derived from the upstream tag at build time
          # (adopt-info), so track what this repo has already published.
          CURRENT=$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || echo "")
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Create release
        if: steps.upstream.outputs.version != steps.current.outputs.version
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.upstream.outputs.version }}
          name: Release ${{ steps.upstream.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
