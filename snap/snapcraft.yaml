name: picoclaw
base: core24
adopt-info: picoclaw
title: PicoClaw
summary: Tiny, fast, local-first personal AI assistant
description: |
  PicoClaw is an ultra-lightweight personal AI assistant — a single static Go
  binary small enough to run on $10 hardware with under 10 MB of RAM. It
  connects to any OpenAI-compatible LLM (locally via Lemonade or Ollama, or
  cloud providers such as OpenAI, Anthropic, Gemini, and 30+ others) and to
  19+ messaging platforms (Telegram, Discord, WhatsApp, Matrix, and more),
  performing agentic tasks with persistent memory and skills.

  LOCAL AI

  Run 'picoclaw.lemonade' to detect a running lemonade-server
  (http://127.0.0.1:13305), pick one of its models from a menu, and configure
  it as PicoClaw's default — fully offline, no API key required.

  Or run 'picoclaw.inference-snap' to pick a Canonical inference snap
  (gemma4, gemma3, deepseek-r1, and others) as the provider instead.

  SETUP

  Run the onboarding wizard on first launch:

    picoclaw onboard

  Then add a provider API key (or use Lemonade/Ollama locally) and chat:

    picoclaw agent -m "Hello!"

  The background gateway service (chat integrations) starts automatically the
  first time you run any picoclaw command and is managed as a standard systemd
  user unit:

    systemctl --user status picoclaw
    systemctl --user stop picoclaw

  SECURITY NOTE

  This tool is capable of executing code, accessing files, and interacting
  with external services on your behalf. Due to the nature of autonomous
  AI agents, we recommend installing and running this snap inside an LXD
  container as best practice. A container provides an extra layer of
  confinement, limiting the agent's reach to the container environment
  and reducing exposure to your host system and personal data.

    lxc launch ubuntu:24.04 my-agent
    lxc exec my-agent -- snap install --classic picoclaw

source-code: https://github.com/kenvandine/picoclaw-snap
issues: https://github.com/kenvandine/picoclaw-snap/issues
contact: https://github.com/kenvandine/picoclaw-snap/issues
website: https://picoclaw.io
license: MIT

grade: stable
confinement: classic

apps:
  # Interactive CLI — onboarding wizard, agent chat, config, status, etc.
  picoclaw:
    command: bin/picoclaw-launch

  # Interactive Lemonade model picker.  Run as: picoclaw.lemonade
  lemonade:
    command: bin/picoclaw-lemonade
    environment:
      CLAW_CLI_NAME: picoclaw

  # Interactive inference snap picker.  Run as: picoclaw.inference-snap
  inference-snap:
    command: bin/picoclaw-inference-snap
    environment:
      CLAW_CLI_NAME: picoclaw
      CLAW_INFERENCE_SNAPS: "gemma3 gemma4 deepseek-r1 nemotron-3-nano nemotron-3-nano-omni qwen-vl"

  # Gateway daemon — registered as /snap/bin/picoclaw.daemon so the snap
  # wrapper sets up $SNAP and friends before exec-ing the launch script.
  # Managed by the systemd user unit installed on first run of 'picoclaw'.
  daemon:
    command: bin/picoclaw-daemon-launch

parts:
  launcher:
    plugin: dump
    source: snap/local
    organize:
      bin/picoclaw-launch: bin/picoclaw-launch
      bin/picoclaw-daemon-launch: bin/picoclaw-daemon-launch
      bin/picoclaw-lemonade: bin/picoclaw-lemonade
      bin/picoclaw-inference-snap: bin/picoclaw-inference-snap
      share/systemd/user/picoclaw.service: share/systemd/user/picoclaw.service

  picoclaw:
    plugin: nil
    override-pull: |
      # Fetch the latest release tag from GitHub.
      VERSION=$(curl -fsSL \
        "https://api.github.com/repos/sipeed/picoclaw/releases/latest" \
        | grep '"tag_name"' | head -1 \
        | sed 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
      if [ -z "$VERSION" ]; then
        echo "picoclaw: failed to determine latest release version" >&2
        exit 1
      fi
      craftctl set version="${VERSION#v}"

      # Map the snap target arch to PicoClaw's release-asset arch label.
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)   ARCH="x86_64" ;;
        arm64)   ARCH="arm64" ;;
        armhf)   ARCH="armv7" ;;
        riscv64) ARCH="riscv64" ;;
        *) echo "picoclaw: unsupported architecture: $CRAFT_ARCH_BUILD_FOR" >&2; exit 1 ;;
      esac

      TARBALL="picoclaw_Linux_${ARCH}.tar.gz"
      echo "picoclaw: downloading ${TARBALL} (${VERSION})"
      curl -fsSL \
        "https://github.com/sipeed/picoclaw/releases/download/${VERSION}/${TARBALL}" \
        -o "$CRAFT_PART_SRC/picoclaw.tar.gz"
      tar -xzf "$CRAFT_PART_SRC/picoclaw.tar.gz" -C "$CRAFT_PART_SRC"
    override-build: |
      # The tarball ships the static `picoclaw` binary plus a `picoclaw-launcher`
      # (browser WebUI helper); install both.
      install -Dm755 "$CRAFT_PART_SRC/picoclaw" "$CRAFT_PART_INSTALL/bin/picoclaw"
      if [ -f "$CRAFT_PART_SRC/picoclaw-launcher" ]; then
        install -Dm755 "$CRAFT_PART_SRC/picoclaw-launcher" "$CRAFT_PART_INSTALL/bin/picoclaw-launcher"
      fi
    build-packages:
      - curl
    stage-packages:
      - curl
