name: picoclaw
base: core24
adopt-info: picoclaw
title: PicoClaw
summary: Lightweight CMDOP agent plugin optimised for speed
description: |
  PicoClaw is a lightweight, high-speed CMDOP agent plugin for Node.js. It
  provides a minimal-footprint client for connecting to CMDOP (Command
  Operator) servers via gRPC, optimised for low latency and efficient
  resource usage.

  PicoClaw is primarily a programmatic library (a themed wrapper around the
  @cmdop/node SDK).  The bundled command offers a self-check:

    picoclaw doctor      # verify the SDK loads
    picoclaw version
    picoclaw help

source-code: https://github.com/commandoperator/cmdop-sdk-js
issues: https://github.com/commandoperator/cmdop-sdk-js/issues
contact: https://github.com/commandoperator/cmdop-sdk-js/issues

grade: stable
# Classic confinement, consistent with the other claw snaps: picoclaw bundles
# its own Node.js and performs agentic CMDOP work that needs broad host access.
confinement: classic

apps:
  picoclaw:
    command: bin/picoclaw-launch

parts:
  launcher:
    plugin: dump
    source: snap/local
    organize:
      bin/picoclaw-launch: bin/picoclaw-launch
      bin/picoclaw-cli.js: bin/picoclaw-cli.js

  picoclaw:
    plugin: npm
    source: .
    npm-include-node: true
    npm-node-version: '22.16.0'
    override-build: |
      craftctl default
      export PATH="$CRAFT_PART_INSTALL/bin:$PATH"
      # Classic confinement runs against the host's dynamic linker, so the
      # bundled node needs no patchelf (matches the openclaw/zeroclaw snaps).
      # Patching node to core24's linker segfaults on hosts whose glibc differs
      # (observed on Ubuntu 26.04).
      npm install -g --prefix "$CRAFT_PART_INSTALL" picoclaw
      craftctl set version="$("$CRAFT_PART_INSTALL/bin/node" -e \
        "console.log(require('$CRAFT_PART_INSTALL/lib/node_modules/picoclaw/package.json').version)")"
    build-packages:
      - python3
